# builds and tests every push and pull request, on gcc and clang.
# the sanitizers are the point. a build that only passes -O2 is not verified.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - uses: actions/checkout@v4

    - name: set compiler
      run: |
        echo "CC=${{ matrix.compiler }}" >> $GITHUB_ENV

    # flint compiles in a fraction of a second, so ccache buys almost nothing
    # here. kept because the matrix runs the same build several times over.
    - name: configure ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        ccache --max-size=50M
        ccache -z

    - name: release build
      run: make clean && make release

    - name: language tests
      run: make test

    - name: unit tests
      run: make unit

    - name: debug build and disassembler
      run: make clean && make debug

    # gc on every allocation plus asan and ubsan. slow, catches everything.
    - name: gc stress and sanitizers
      run: make clean && make stress

    # The computed-goto interpreter. It is a separate binary and a separate
    # build script, so nothing else in this workflow exercises it, and a
    # transformation bug in scripts/to_computed_goto.py shows up as a crash at
    # run time rather than as a compile error.
    - name: computed-goto interpreter
      run: |
        make flint-goto
        sh tests/run_tests.sh ./flint-goto

    # clang-tidy, which reports include-hygiene problems the compiler does not.
    #
    # The LLVM apt packages are the point. The runner's preinstalled
    # clang-format/tidy are whatever Ubuntu shipped, and .clang-format uses
    # KeepEmptyLines as a nested block, which only exists in clang 19+. On the
    # runner's version clang-tidy aborted before checking a single line, so
    # this step had never actually run -- it just exited 2 and was marked
    # continue-on-error.
    #
    # Pinning the toolchain is what makes it run. The --depth=1 packages are
    # from the LLVM apt repo and always current.
    - name: install llvm
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gpg
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key           | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
          http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y clang-tidy

    - name: clang-tidy
      run: make lint
      # Advisory by design: the target says so, and a lint policy change
      # should not be able to block a push. The annotations it produces are
      # the report, not a gate.
      continue-on-error: true

    # A file with no trailing newline is a compile error under clang
    # (-Wnewline-eof) and accepted by gcc. That asymmetry cost a CI run before
    # it was noticed, and it is trivially checkable.
    - name: files end with a newline
      run: |
        bad=0
        for f in $(git ls-files '*.c' '*.h' '*.fl' '*.md' '*.py' '*.sh'); do
          if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then
            echo "no newline at end of file: $f"
            bad=1
          fi
        done
        exit $bad

    - name: ccache stats
      run: ccache -s
