# tags a v* push. builds the release binary, runs the tests, publishes a
# tarball. no release goes out with a failing test suite.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-24.04
    # Pinned rather than floating. ubuntu-latest migrates without warning --
    # it is scheduled to become 26.04 -- and a new runner image means new
    # preinstalled compilers, which is how a green build goes red with no
    # code changing. Bump deliberately, after watching a full run go green
    # on the new image.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5
      # v4 targets Node 20, which the runners now shim with a deprecation
      # notice on every job. v5 targets the current runtime.

    - name: configure ccache
      run: |
        sudo apt-get update && sudo apt-get install -y ccache
        ccache --max-size=50M
        ccache -z

    - name: release build
      run: make clean && make release

    - name: language tests
      run: make test

    - name: unit tests
      run: make unit

    # a release is the one build where the sanitizers are not optional.
    # `make test` alone is the language suite and never sees asan, so a
    # regression that only shows up there would ship.
    #
    # no `make clean` before this. stress builds into its own object tree
    # and leaves ./flint alone, and a clean here deletes the binary two steps
    # before it gets packaged. which it did, once.
    - name: gc stress and sanitizers
      run: make stress

    # The binary alone is not a usable release: `import encoding` looks for
    # lib/ beside the executable, so a tarball with only `flint` in it fails
    # every import that is not a source-relative module. The library ships
    # in the same tarball for exactly that reason.
    - name: package
      run: |
        mkdir -p stage
        cp flint stage/flint
        cp -r lib stage/lib
        cp README.md SPEC.md RELEASES.md LICENSE stage/
        tar -czvf flint-${{ github.ref_name }}-linux-x86_64.tar.gz -C stage .

    - name: smoke test the artifact
      run: |
        # unpack what was just built and use it the way a person would, so a
        # tarball that cannot import its own standard library fails here
        # rather than in someone else's shell.
        rm -rf verify && mkdir verify
        tar -xzf flint-${{ github.ref_name }}-linux-x86_64.tar.gz -C verify
        chmod +x verify/flint
        cd verify
        ./flint --version
        ./flint -e 'import encoding
        print(encoding.base64_encode("flint"))'

    - name: publish
      uses: softprops/action-gh-release@v2
      with:
        files: flint-${{ github.ref_name }}-linux-x86_64.tar.gz
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
