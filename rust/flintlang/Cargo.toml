[package]
name = "flintlang"
version = "0.13.2"
edition = "2021"
description = "Safe Rust embedding of the Flint scripting language runtime"
license = "MIT"
repository = "https://github.com/programmersd21/flint"
keywords = ["scripting", "embedding", "interpreter"]
categories = ["api-bindings"]
build = "build.rs"

[lib]
name = "flintlang"
path = "src/lib.rs"

[dependencies]
flintlang-sys = { version = "0.13.2", path = "../flintlang-sys" }
